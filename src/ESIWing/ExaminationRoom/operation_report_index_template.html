<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation Full Report Index</title>
    <style>
        body {
            margin: 0;
            background: #0d0f12;
            color: #f2f4f8;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .page {
            width: min(1200px, calc(100vw - 32px));
            margin: 0 auto;
            padding: 28px 0 40px;
        }

        h1 {
            margin: 0 0 18px;
            letter-spacing: -0.04em;
        }

        p {
            color: #aab2bf;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 18px;
            background: #171a1f;
            border: 1px solid #30353d;
            border-radius: 16px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid #30353d;
        }

        th {
            color: #ffe45e;
            background: #1f232a;
        }

        a {
            color: #00ff87;
        }
    </style>
</head>
<body>
    <div class="page">
        <h1>Operation Full Report Index</h1>
        <p>Open a full report index for each operation in this batch.</p>
        <table>
            <thead>
                <tr><th>Operation</th><th>HTML Reports</th><th>Report</th></tr>
            </thead>
            <tbody>
                {% for entry in indexEntries %}
                <tr>
                    <td>{{ entry.operationName }}</td>
                    <td>{{ entry.reportCount }}</td>
                    <td><a href="{{ entry.reportRelPath }}" target="_blank" rel="noopener">Open report</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
